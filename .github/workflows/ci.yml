name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build
        run: bun run build

      - name: Test deal-checker (self-test, khong goi API)
        run: bun run test

      - name: Test popup-watcher (che do --test, khong cho khung gio)
        run: bun run test:watcher

      - name: Test CLI (dispatch qua cli.ts)
        run: bun run src/cli.ts self-test

      # Chi parse cu phap, khong chay code WinForms nen an toan tren Linux.
      - name: Kiem tra cu phap run.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('run.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'run.ps1: syntax OK'

  # Build file chay doc lap bang Bun compile, khong can cai Bun
  # tren may dich. Exe Windows duoc cross-compile tu Ubuntu.
  build-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build exe Windows + binary Linux
        run: |
          bun run build:exe
          bun run build:exe:linux
          ls -lh dist/
          file dist/zcode-deal.exe dist/zcode-deal

      - name: Upload exe Windows
        uses: actions/upload-artifact@v7
        with:
          name: zcode-deal-windows-x64
          path: dist/zcode-deal.exe

      - name: Upload binary Linux
        uses: actions/upload-artifact@v7
        with:
          name: zcode-deal-linux-x64
          path: dist/zcode-deal

  # Build app tray Go cho Windows (cross-build tu Ubuntu, khong
  # can runner Windows) + test logic checker. Job nay khong chan
  # job check/build-exe, chi cung cap artifact de test tren Windows.
  tray-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Test logic checker
        working-directory: tray-go
        run: go test ./internal/...

      - name: Build exe Windows
        working-directory: tray-go
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H windowsgui -s -w" -o dist/zcode-deal-tray.exe .

      - name: Upload exe Windows
        uses: actions/upload-artifact@v7
        with:
          name: zcode-deal-tray-windows-x64
          path: tray-go/dist/zcode-deal-tray.exe
