name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Vet
        run: go vet ./...

      - name: Test (khong goi API that)
        run: go test ./...

      - name: Build Linux
        run: go build -o dist/zcode-deal .

  # Build exe Windows cross-build tu Ubuntu (khong can CGO) de test
  # tren may that. Exe dung -H windowsgui: chay khong mo console.
  build-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build exe Windows + binary Linux
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H windowsgui -s -w" -o dist/zcode-deal.exe .
          CGO_ENABLED=0 go build -o dist/zcode-deal .
          ls -lh dist/
          file dist/zcode-deal.exe dist/zcode-deal

      - name: Upload exe Windows
        uses: actions/upload-artifact@v7
        with:
          name: zcode-deal-windows-x64
          path: dist/zcode-deal.exe

      - name: Upload binary Linux
        uses: actions/upload-artifact@v7
        with:
          name: zcode-deal-linux-x64
          path: dist/zcode-deal
