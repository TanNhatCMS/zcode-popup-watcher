name: Release

# Cach phat hanh:
#   git tag v2.1.0
#   git push origin v2.1.0
# Workflow build 1 lan (Ubuntu, cross-build) roi tao GitHub Release
# mang ten tag, dinh kem zcode-deal.exe (Windows x64, khong console)
# va zcode-deal (Linux x64).
# Cung co the chay thu cong tu tab Actions (workflow_dispatch) voi
# input tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cua release can tao (vi du v2.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build exe Windows + binary Linux
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H windowsgui -s -w" -o dist/zcode-deal.exe .
          CGO_ENABLED=0 go build -o dist/zcode-deal .
          ls -lh dist/
          file dist/zcode-deal.exe dist/zcode-deal

      - name: Tao release va dinh kem file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG da ton tai, upload lai (ghi de)."
            gh release upload "$TAG" --clobber dist/zcode-deal.exe dist/zcode-deal
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              dist/zcode-deal.exe dist/zcode-deal
          fi
